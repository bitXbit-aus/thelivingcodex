<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Node Constellation — The Living Codex</title>
  <meta name="theme-color" content="#05050d">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #05050d;
      color: #e8e4dc;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      touch-action: none;
    }
    ::selection { background: rgba(212,168,83,0.3); color: #fff; }

    /* Starfield canvas */
    #starfield {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* Map container */
    #map-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #map-container svg {
      width: 100%; height: 100%;
      pointer-events: all;
    }

    /* UI Layer */
    #ui-layer {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #ui-layer > * { pointer-events: auto; }

    /* Header */
    .header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 1.25rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(5,5,13,0.9) 0%, transparent 100%);
      pointer-events: none;
    }
    .header > * { pointer-events: auto; }
    .header-brand {
      display: flex; align-items: center; gap: 0.75rem;
    }
    .header-brand-icon {
      width: 2rem; height: 2rem; border-radius: 50%;
      border: 1px solid rgba(212,168,83,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .header-brand-icon svg { width: 14px; height: 14px; color: #d4a853; }
    .header-brand span {
      font-size: 0.8rem; color: rgba(255,255,255,0.7);
      letter-spacing: 0.15em; text-transform: uppercase;
    }
    .header-sub {
      font-size: 0.6rem; color: rgba(255,255,255,0.3);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-top: 0.15rem;
    }

    /* Node sidebar */
    .node-sidebar {
      position: absolute; top: 4.5rem; left: 1rem;
      width: 260px; max-height: calc(100vh - 6rem);
      overflow-y: auto;
      background: rgba(10,11,15,0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 1rem;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .node-sidebar::-webkit-scrollbar { width: 4px; }
    .node-sidebar::-webkit-scrollbar-thumb { background: rgba(212,168,83,0.2); border-radius: 2px; }
    .node-sidebar-title {
      font-size: 0.6rem; color: rgba(255,255,255,0.3);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .node-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.6rem 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.25rem;
    }
    .node-item:hover { background: rgba(255,255,255,0.04); }
    .node-item.active { background: rgba(212,168,83,0.08); border: 1px solid rgba(212,168,83,0.15); }
    .node-item-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }
    .node-item-info { flex: 1; min-width: 0; }
    .node-item-name {
      font-size: 0.8rem; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .node-item-meta {
      font-size: 0.6rem; color: rgba(255,255,255,0.35);
      margin-top: 0.1rem;
    }
    .node-item-status {
      font-size: 0.55rem; padding: 0.15rem 0.4rem;
      border-radius: 4px; text-transform: uppercase;
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }
    .status-active { background: rgba(34,197,94,0.12); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
    .status-future { background: rgba(212,168,83,0.08); color: #d4a853; border: 1px solid rgba(212,168,83,0.15); }

    /* Detail panel */
    .detail-panel {
      position: absolute; top: 4.5rem; right: 1rem;
      width: 320px; max-height: calc(100vh - 6rem);
      overflow-y: auto;
      background: rgba(10,11,15,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem;
      transform: translateX(360px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .detail-panel.open { transform: translateX(0); opacity: 1; }
    .detail-close {
      position: absolute; top: 1rem; right: 1rem;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(255,255,255,0.4);
      transition: all 0.2s;
    }
    .detail-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .detail-halo {
      width: 64px; height: 64px; border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .detail-halo::before {
      content: ''; position: absolute; inset: -8px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: 0.3;
      animation: halo-pulse 3s ease-in-out infinite;
    }
    @keyframes halo-pulse { 0%,100%{transform:scale(1);opacity:0.3} 50%{transform:scale(1.15);opacity:0.1} }
    .detail-halo-inner {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .detail-name {
      text-align: center;
      font-size: 1.25rem; font-weight: 300; color: #fff;
      margin-bottom: 0.25rem;
    }
    .detail-location {
      text-align: center;
      font-size: 0.75rem; color: rgba(255,255,255,0.4);
      margin-bottom: 1.25rem;
    }
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .detail-stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }
    .detail-stat-label {
      font-size: 0.55rem; color: rgba(255,255,255,0.3);
      letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .detail-stat-value {
      font-size: 0.9rem; color: #fff; font-weight: 300;
    }
    .detail-narrative {
      font-size: 0.8rem; color: rgba(255,255,255,0.5);
      line-height: 1.6; margin-bottom: 1.25rem;
      font-style: italic;
    }
    .detail-btn {
      width: 100%; padding: 0.75rem;
      border-radius: 8px; border: none;
      font-size: 0.8rem; font-weight: 500;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      text-decoration: none;
    }
    .detail-btn-primary {
      background: #d4a853; color: #0a0b0f;
      margin-bottom: 0.5rem;
    }
    .detail-btn-primary:hover { background: #e8b858; }
    .detail-btn-secondary {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .detail-btn-secondary:hover { border-color: rgba(212,168,83,0.3); color: #d4a853; }

    /* Legend */
    .legend {
      position: absolute; bottom: 1.5rem; left: 1rem;
      display: flex; gap: 1rem;
      background: rgba(10,11,15,0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
    }
    .legend-item {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.6rem; color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .legend-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }

    /* Mobile toggle */
    .mobile-toggle {
      display: none;
      position: absolute; top: 1.25rem; right: 1rem;
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(10,11,15,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      z-index: 20;
    }

    /* Scanlines overlay */
    .scanlines {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px);
      pointer-events: none; z-index: 5;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .node-sidebar { width: 220px; }
      .detail-panel { width: 280px; }
    }
    @media (max-width: 768px) {
      .mobile-toggle { display: flex; }
      .node-sidebar {
        transform: translateX(-280px); opacity: 0;
        top: 3.5rem; left: 0; right: 0; width: auto;
        max-height: calc(100vh - 4rem);
        border-radius: 0; border-left: none; border-right: none;
      }
      .node-sidebar.open { transform: translateX(0); opacity: 1; }
      .detail-panel {
        top: auto; bottom: 0; left: 0; right: 0;
        width: 100%; max-height: 70vh;
        transform: translateY(100%);
        border-radius: 16px 16px 0 0;
      }
      .detail-panel.open { transform: translateY(0); }
      .header { padding: 1rem; }
      .legend { bottom: 1rem; left: 0.5rem; gap: 0.6rem; padding: 0.4rem 0.6rem; }
    }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div id="map-container">
  <svg id="constellation-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(212,168,83,0.4)"/>
        <stop offset="50%" stop-color="rgba(212,168,83,0.8)"/>
        <stop offset="100%" stop-color="rgba(212,168,83,0.4)"/>
      </linearGradient>
    </defs>
    <!-- Continent outlines -->
    <g id="continents" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"></g>
    <!-- Grid lines -->
    <g id="grid" stroke="rgba(255,255,255,0.03)" stroke-width="0.3"></g>
    <!-- Connection lines -->
    <g id="connections"></g>
    <!-- Nodes -->
    <g id="nodes"></g>
    <!-- Labels -->

</div>

<div class="scanlines"></div>

<div id="ui-layer">

      </div>

        <div class="header-brand-span" style="font-size:0.8rem;color:rgba(255,255,255,0.7);letter-spacing:0.15em;text-transform:uppercase;">The Living Codex</div>
        <div class="header-sub">Node Constellation Map</div>

    </div>
  </div>

  <button class="mobile-toggle" id="sidebarToggle" aria-label="Toggle nodes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <div class="node-sidebar" id="nodeSidebar">
    <div class="node-sidebar-title">Active Nodes · 4</div>
    <div id="activeNodeList"></div>
    <div class="node-sidebar-title" style="margin-top:1rem;">Future Nodes · 4</div>
    <div id="futureNodeList"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" id="detailClose">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e;box-shadow:0 0 6px #22c55e"></div> Active</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d4a853;box-shadow:0 0 6px #d4a853"></div> Future</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(255,255,255,0.2)"></div> Connection</div>
  </div>
</div>

// ==================== STARFIELD ====================
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let width, height;
let stars = [];
let nebulae = [];
let mouse = { x: 0, y: 0 };
let targetMouse = { x: 0, y: 0 };

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  stars = [];
  const count = Math.floor((width * height) / 800);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      z: Math.random() * 3 + 0.5,
      size: Math.random() * 1.5 + 0.3,
      alpha: Math.random() * 0.6 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleOffset: Math.random() * Math.PI * 2
    });
  }
  nebulae = [
    { x: width * 0.2, y: height * 0.3, r: Math.min(width, height) * 0.4, color: 'rgba(99,102,241,0.03)' },
    { x: width * 0.7, y: height * 0.6, r: Math.min(width, height) * 0.35, color: 'rgba(212,168,83,0.02)' },
    { x: width * 0.5, y: height * 0.2, r: Math.min(width, height) * 0.3, color: 'rgba(34,197,94,0.02)' },
    { x: width * 0.85, y: height * 0.4, r: Math.min(width, height) * 0.25, color: 'rgba(167,139,250,0.02)' },
  ];
}

function drawStarfield(time) {
  ctx.fillStyle = '#05050d';
  ctx.fillRect(0, 0, width, height);

  // Nebulae
  nebulae.forEach(n => {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, n.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  });

  // Stars with parallax
  mouse.x += (targetMouse.x - mouse.x) * 0.05;
  mouse.y += (targetMouse.y - mouse.y) * 0.05;

  stars.forEach(s => {
    const parallaxX = (mouse.x - width / 2) * 0.02 * s.z;
    const parallaxY = (mouse.y - height / 2) * 0.02 * s.z;
    const twinkle = Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.arc(s.x + parallaxX, s.y + parallaxY, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha * twinkle})`;
    ctx.fill();
  });

  requestAnimationFrame(t => drawStarfield(t * 0.001));
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => {
  targetMouse.x = e.clientX;
  targetMouse.y = e.clientY;
});
window.addEventListener('touchmove', e => {
  if (e.touches.length) {
    targetMouse.x = e.touches[0].clientX;
    targetMouse.y = e.touches[0].clientY;

}, { passive: true });

const continentsG = document.getElementById('continents');
const gridG = document.getElementById('grid');
const connectionsG = document.getElementById('connections');
const nodesG = document.getElementById('nodes');
const labelsG = document.getElementById('labels');

// Simplified continent paths (rough world map outline)
const continentPaths = [
  // North America

  // South America

  // Europe

  // Africa
  "M430,140 L470,135 L510,150 L530,190 L520,250 L500,300 L470,320 L440,300 L420,250 L410,200 L420,170 Z",
  // Asia
  "M520,60 L580,50 L650,55 L720,70 L780,100 L820,130 L840,170 L820,210 L780,230 L720,220 L660,200 L600,180 L550,150 L520,120 L510,90 Z",
  // Australia
  "M760,280 L820,270 L860,290 L870,330 L850,360 L810,370 L770,360 L740,340 L730,310 Z",

function drawMap() {
  // Continents
  continentPaths.forEach(d => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    continentsG.appendChild(path);
  });

  // Grid
  for (let i = 0; i <= 10; i++) {
    const x = i * 100;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x); line.setAttribute('y1', 0);
    line.setAttribute('x2', x); line.setAttribute('y2', 500);
    gridG.appendChild(line);
  }
  for (let i = 0; i <= 5; i++) {
    const y = i * 100;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 0); line.setAttribute('y1', y);
    line.setAttribute('x2', 1000); line.setAttribute('y2', y);
    gridG.appendChild(line);
  }

  // Connections
  connections.forEach((conn, i) => {
    const from = nodes.find(n => n.id === conn.from);
    const to = nodes.find(n => n.id === conn.to);
    if (!from || !to) return;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', from.coords.x);
    line.setAttribute('y1', from.coords.y);
    line.setAttribute('x2', to.coords.x);
    line.setAttribute('y2', to.coords.y);
    line.setAttribute('stroke', 'url(#line-gradient)');
    line.setAttribute('stroke-width', '0.8');
    line.setAttribute('stroke-dasharray', '4 6');
    line.setAttribute('opacity', '0.5');
    line.style.animation = `dashFlow 20s linear infinite ${i * 0.5}s`;
    connectionsG.appendChild(line);
  });

  // Add dash animation
  const style = document.createElement('style');
  style.textContent = `
    @keyframes dashFlow {
      to { stroke-dashoffset: -200; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; opacity: 0.8; }
      50% { r: 7; opacity: 1; }
    }
    @keyframes ringExpand {
      0% { r: 5; opacity: 0.6; }
      100% { r: 20; opacity: 0; }
    }
  `;
  svg.appendChild(style);

  // Nodes
  nodes.forEach(node => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'node-marker');
    g.setAttribute('data-id', node.id);
    g.style.cursor = 'pointer';

    // Outer glow ring (animated for active)
    if (node.status === 'active') {
      const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      ring.setAttribute('cx', node.coords.x);
      ring.setAttribute('cy', node.coords.y);
      ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', node.color);
      ring.setAttribute('stroke-width', '0.5');
      ring.setAttribute('opacity', '0.3');
      ring.style.animation = 'ringExpand 3s ease-out infinite';
      g.appendChild(ring);
    }

    // Halo
    const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    halo.setAttribute('cx', node.coords.x);
    halo.setAttribute('cy', node.coords.y);
    halo.setAttribute('r', node.status === 'active' ? '12' : '8');
    halo.setAttribute('fill', node.color);
    halo.setAttribute('opacity', '0.08');
    halo.setAttribute('filter', 'url(#glow)');
    g.appendChild(halo);

    // Core dot
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', node.coords.x);
    dot.setAttribute('cy', node.coords.y);
    dot.setAttribute('r', node.status === 'active' ? '5' : '3.5');
    dot.setAttribute('fill', node.color);
    dot.setAttribute('filter', 'url(#glow-strong)');
    if (node.status === 'active') {
      dot.style.animation = 'nodePulse 3s ease-in-out infinite';
    }
    g.appendChild(dot);

    // Frequency ring
    const freqRing = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    freqRing.setAttribute('cx', node.coords.x);
    freqRing.setAttribute('cy', node.coords.y);
    freqRing.setAttribute('r', node.status === 'active' ? '8' : '5');
    freqRing.setAttribute('fill', 'none');
    freqRing.setAttribute('stroke', node.color);
    freqRing.setAttribute('stroke-width', '0.6');
    freqRing.setAttribute('opacity', '0.4');
    freqRing.setAttribute('stroke-dasharray', '2 3');
    g.appendChild(freqRing);

    // Click handler
    g.addEventListener('click', () => openDetail(node));
    g.addEventListener('mouseenter', () => {
      halo.setAttribute('opacity', '0.15');
      dot.setAttribute('r', node.status === 'active' ? '7' : '5');
    });
    g.addEventListener('mouseleave', () => {
      halo.setAttribute('opacity', '0.08');
      dot.setAttribute('r', node.status === 'active' ? '5' : '3.5');
    });

    nodesG.appendChild(g);

    // Label
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', node.coords.x);
    label.setAttribute('y', node.coords.y + (node.status === 'active' ? 22 : 16));
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('fill', 'rgba(255,255,255,0.5)');
    label.setAttribute('font-size', node.status === 'active' ? '8' : '6');
    label.setAttribute('font-family', 'Helvetica Neue, Helvetica, Arial, sans-serif');
    label.setAttribute('letter-spacing', '0.05em');
    label.textContent = node.name.toUpperCase();
    labelsG.appendChild(label);

    // Frequency label
    const freqLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    freqLabel.setAttribute('x', node.coords.x);
    freqLabel.setAttribute('y', node.coords.y + (node.status === 'active' ? 32 : 24));
    freqLabel.setAttribute('text-anchor', 'middle');
    freqLabel.setAttribute('fill', node.color);
    freqLabel.setAttribute('font-size', node.status === 'active' ? '7' : '5');
    freqLabel.setAttribute('font-family', 'Helvetica Neue, Helvetica, Arial, sans-serif');
    freqLabel.setAttribute('opacity', '0.6');
    freqLabel.textContent = `${node.freq} Hz`;
    labelsG.appendChild(freqLabel);
  });
}

// ==================== UI ====================
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');
const detailClose = document.getElementById('detailClose');
const activeNodeList = document.getElementById('activeNodeList');
const futureNodeList = document.getElementById('futureNodeList');
const sidebar = document.getElementById('nodeSidebar');
const sidebarToggle = document.getElementById('sidebarToggle');

function createNodeItem(node) {
  const div = document.createElement('div');
  div.className = 'node-item';
  div.dataset.id = node.id;
  div.innerHTML = `
    <div class="node-item-dot" style="background:${node.color};color:${node.color}"></div>
    <div class="node-item-info">
      <div class="node-item-name">${node.name}</div>
      <div class="node-item-meta">${node.location} · ${node.freq} Hz</div>
    </div>
    <div class="node-item-status ${node.status === 'active' ? 'status-active' : 'status-future'}">${node.status}</div>
  `;
  div.addEventListener('click', () => {
    openDetail(node);
    document.querySelectorAll('.node-item').forEach(i => i.classList.remove('active'));
    div.classList.add('active');
    if (window.innerWidth <= 768) sidebar.classList.remove('open');
  });
  return div;
}

function populateSidebar() {
  activeNodeList.innerHTML = '';
  futureNodeList.innerHTML = '';
  nodes.filter(n => n.status === 'active').forEach(n => activeNodeList.appendChild(createNodeItem(n)));
  nodes.filter(n => n.status === 'future').forEach(n => futureNodeList.appendChild(createNodeItem(n)));
}

function openDetail(node) {
  const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(node.location)}`;
  detailContent.innerHTML = `
    <div class="detail-halo" style="color:${node.color}">
      <div class="detail-halo-inner" style="background:${node.color}15;border:1px solid ${node.color}40;">
        <span>${node.emoji}</span>
      </div>
    </div>
    <div class="detail-name">${node.name}</div>
    <div class="detail-location">${node.location}</div>
    <div class="detail-grid">
      <div class="detail-stat">
        <div class="detail-stat-label">Frequency</div>
        <div class="detail-stat-value" style="color:${node.color}">${node.freq} Hz</div>
      </div>
      <div class="detail-stat">
        <div class="detail-stat-label">Chakra</div>
        <div class="detail-stat-value">${node.freqName}</div>
      </div>
      <div class="detail-stat">
        <div class="detail-stat-label">Crystal</div>
        <div class="detail-stat-value">${node.crystal}</div>
      </div>
      <div class="detail-stat">
        <div class="detail-stat-label">Status</div>
        <div class="detail-stat-value" style="color:${node.status === 'active' ? '#22c55e' : '#d4a853'}">${node.status === 'active' ? 'Activated' : 'Awaiting'}</div>
      </div>
    </div>
    <div class="detail-narrative">"${node.narrative}"</div>
    <a href="${mapsUrl}" target="_blank" rel="noopener" class="detail-btn detail-btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Get Directions
    </a>
    <button class="detail-btn detail-btn-secondary" onclick="focusNode('${node.id}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      Focus on Map
    </button>
  `;
  detailPanel.classList.add('open');
}

function closeDetail() {
  detailPanel.classList.remove('open');
  document.querySelectorAll('.node-item').forEach(i => i.classList.remove('active'));
}

detailClose.addEventListener('click', closeDetail);

function focusNode(nodeId) {
  const node = nodes.find(n => n.id === nodeId);
  if (!node) return;
  // Flash the node on the map
  const marker = document.querySelector(`.node-marker[data-id="${nodeId}"]`);
  if (marker) {
    marker.style.filter = 'brightness(2)';
    setTimeout(() => marker.style.filter = '', 600);
  }
}

sidebarToggle.addEventListener('click', () => {
  sidebar.classList.toggle('open');
});

// Close detail on outside click
window.addEventListener('click', e => {
  if (detailPanel.classList.contains('open') &&
      !detailPanel.contains(e.target) &&
      !e.target.closest('.node-marker') &&
      !e.target.closest('.node-item')) {
    closeDetail();
  }
});

// ==================== INIT ====================
resize();
drawStarfield(0);
drawMap();
populateSidebar();

// Handle SVG viewBox scaling
function fitSvg() {
  const rect = document.getElementById('map-container').getBoundingClientRect();
  const aspect = 1000 / 500;
  const containerAspect = rect.width / rect.height;
  if (containerAspect > aspect) {
    svg.style.height = '100%';
    svg.style.width = 'auto';
  } else {
    svg.style.width = '100%';
    svg.style.height = 'auto';
  }
}
window.addEventListener('resize', fitSvg);
fitSvg();
</script>
